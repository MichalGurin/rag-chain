services:
  agent-api:
    build:
      context: ..
      dockerfile: app/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: "postgresql+psycopg://rag:rag@db:5432/rag"
      LLM_BASE_URL: http://ollama:11434/v1
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  ingestion-worker:
    build:
      context: ..
      dockerfile: app/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: "postgresql+psycopg://rag:rag@db:5432/rag"
      LLM_BASE_URL: http://ollama:11434/v1
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "--queues=document-ingestion",
      ]
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-api:
        condition: service_healthy
    restart: unless-stopped

  job-dispatcher:
    build:
      context: ..
      dockerfile: app/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: "postgresql+psycopg://rag:rag@db:5432/rag"
      REDIS_URL: redis://redis:6379/0
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  redisdata:
  uploads:
