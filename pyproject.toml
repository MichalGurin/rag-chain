[project]
name = "prod-rag"
version = "0.1.0"
description = "A production-oriented FastAPI RAG starter using pgvector"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.14.0",
    "boto3>=1.35.0",
    "celery[redis]>=5.4.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain-openai>=0.3.0",
    "langchain-postgres>=0.0.15",
    "langchain-text-splitters>=0.3.8",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0.2",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "slowapi @ https://github.com/simonvanlierde/slowapi/archive/3193123f4ffd3faa29786777d102d6d4357b89a3.tar.gz",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pyyaml>=6.0.2",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "integration: API-level integration tests with external providers stubbed",
    "e2e: tests requiring live PostgreSQL, Redis, and Celery worker services",
    "live_services: opt-in tests against explicitly configured live providers",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.build-backend]
module-name = "app"
module-root = "."
