services:
  - type: web
    name: prod-rag-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./app/Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT
        value: "20/minute"
      - key: INGEST_RATE_LIMIT
        value: "5/minute"
      - key: MAX_INGEST_CHARS
        value: "250000"
      - key: FORWARDED_ALLOW_IPS
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: CACHE_MAX_ENTRIES
        value: "1000"
      - key: PRIMARY_MODEL
        value: llama3.2:1b
      - key: FALLBACK_MODEL
        value: llama3.2:1b
      - key: EMBEDDING_MODEL
        value: nomic-embed-text
      - key: LLM_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHAT_API_KEY
        sync: false
      - key: INGEST_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
