services:
  - type: web
    name: prod-rag-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./app/Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT
        value: "20/minute"
      - key: INGEST_RATE_LIMIT
        value: "5/minute"
      - key: MAX_INGEST_CHARS
        value: "250000"
      - key: MAX_UPLOAD_BYTES
        value: "50000000"
      - key: MAX_DOCUMENT_PAGES
        value: "1000"
      - key: MAX_DOCUMENT_CHARS
        value: "5000000"
      - key: FORWARDED_ALLOW_IPS
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: CACHE_MAX_ENTRIES
        value: "1000"
      - key: PRIMARY_MODEL
        value: llama3.2:1b
      - key: FALLBACK_MODEL
        value: llama3.2:1b
      - key: EMBEDDING_MODEL
        value: nomic-embed-text
      - key: LLM_API_KEY
        sync: false
      - key: VECTOR_COLLECTION_NAME
        value: documents
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "10"
      - key: LLM_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHAT_API_KEY
        sync: false
      - key: TENANT_ID
        sync: false
      - key: INGEST_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: prod-rag-redis
          property: connectionString
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: COHERE_API_KEY
        sync: false
      - key: RERANK_MODEL
        value: rerank-v3.5
    healthCheckPath: /health
    autoDeploy: true

  - type: worker
    name: prod-rag-ingestion
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./app/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.ingestion.tasks.celery_app worker --loglevel=INFO --concurrency=2 --queues=document-ingestion
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: prod-rag-redis
          property: connectionString
      - key: LLM_BASE_URL
        sync: false
      - key: PRIMARY_MODEL
        value: llama3.2:1b
      - key: FALLBACK_MODEL
        value: llama3.2:1b
      - key: EMBEDDING_MODEL
        value: nomic-embed-text
      - key: LLM_API_KEY
        sync: false
      - key: VECTOR_COLLECTION_NAME
        value: documents
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "10"
      - key: CHAT_API_KEY
        sync: false
      - key: TENANT_ID
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/rag-uploads
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1

  - type: worker
    name: prod-rag-job-dispatcher
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./app/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.ingestion.tasks.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: prod-rag-redis
          property: connectionString
      - key: CHAT_API_KEY
        sync: false
      - key: TENANT_ID
        sync: false
      - key: INGEST_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: nomic-embed-text
      - key: VECTOR_COLLECTION_NAME
        value: documents
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1

  - type: redis
    name: prod-rag-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
