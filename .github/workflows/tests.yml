name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libzstd-dev
      - run: uv sync --locked --group dev
      - run: uv run pytest
